<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- AsiaWorks favicon: tall, condensed AW monogram. White field, maroon lettering. -->
  <rect width="64" height="64" rx="12" fill="#FFFFFF"/>
  <!-- scale(x,y): x<1 condenses, y>1 elongates - tall + skinny -->
  <g transform="translate(32 34) scale(0.58 1.32) translate(-32 -34)">
    <text x="32" y="34" text-anchor="middle" dominant-baseline="central"
          font-family="Cinzel, Georgia, 'Times New Roman', serif"
          font-weight="700" font-size="44" letter-spacing="-2"
          fill="#8B1A1A">AW</text>
  </g>
</svg>
